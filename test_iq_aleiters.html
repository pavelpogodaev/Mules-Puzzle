<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головоломка с мулами</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500&display=swap');

        :root {
            --google-bg: #f8f9fa;
            --google-surface: #ffffff;
            --google-border: #dadce0;
            --google-blue: #1a73e8;
            --google-blue-hover: #1557b0;
            --google-text: #202124;
            --google-text-secondary: #5f6368;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--google-bg);
            color: var(--google-text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--google-surface);
            padding: 16px 24px;
            border-bottom: 1px solid var(--google-border);
            z-index: 10;
        }

        h1 {
            font-family: 'Google Sans', sans-serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--google-text);
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--google-text-secondary);
        }

        /* Layout Container */
        .main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            flex-direction: row;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
        }

        /* Рабочая область */
        #workspace {
            flex-grow: 1;
            position: relative;
            background-color: var(--google-bg);
            overflow: hidden;
            background-image: radial-gradient(#dadce0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Боковая панель (Таймер и Таблица) */
        aside {
            width: 320px;
            background-color: var(--google-surface);
            border-left: 1px solid var(--google-border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            aside {
                width: 100%;
                height: 40%;
                border-left: none;
                border-top: 1px solid var(--google-border);
            }
        }

        /* Блок таймера */
        .timer-block {
            text-align: center;
            margin-bottom: 24px;
        }

        .timer-display {
            font-family: 'Google Sans', sans-serif;
            font-size: 36px;
            font-weight: 500;
            color: var(--google-text);
            margin-bottom: 16px;
            font-variant-numeric: tabular-nums;
        }

        /* Кнопки Google Style */
        .btn {
            background-color: var(--google-blue);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-family: 'Google Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn:hover {
            background-color: var(--google-blue-hover);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .btn:disabled {
            background-color: #e8eaed;
            color: #9aa0a6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--google-blue);
            border: 1px solid var(--google-border);
        }

        .btn-outline:hover {
            background-color: #f8f9fa;
            color: var(--google-blue-hover);
            box-shadow: none;
        }

        /* Таблица рекордов */
        .leaderboard {
            flex-grow: 1;
            overflow-y: auto;
        }

        .leaderboard h2 {
            font-family: 'Google Sans', sans-serif;
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--google-text);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--google-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            padding: 8px 4px;
            border-bottom: 1px solid #f1f3f4;
        }

        th {
            color: var(--google-text-secondary);
            font-weight: 500;
        }

        td:last-child, th:last-child {
            text-align: right;
        }

        tr:nth-child(1) td { font-weight: bold; color: #d4af37; } /* Золото */
        tr:nth-child(2) td { font-weight: bold; color: #c0c0c0; } /* Серебро */
        tr:nth-child(3) td { font-weight: bold; color: #cd7f32; } /* Бронза */

        /* Настройки элементов головоломки */
        .piece {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none; /*для мобилок*/
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.12)) drop-shadow(0 1px 2px rgba(0,0,0,0.24));
            transition: filter 0.2s, z-index 0.2s;
            transform-origin: center center;
        }

        .piece:active {
            cursor: grabbing;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.14)) drop-shadow(0 1px 10px rgba(0,0,0,0.12));
        }

        .piece img {
            display: block;
            max-width: 250px; 
            pointer-events: none; 
        }

        .piece.active {
            z-index: 100 !important;
            filter: drop-shadow(0 0 0 2px var(--google-blue)) drop-shadow(0 4px 5px rgba(0,0,0,0.14));
        }

        /* Panel для вращения */
        #controls {
            background-color: var(--google-surface);
            padding: 16px 24px;
            border-top: 1px solid var(--google-border);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        label {
            font-size: 14px;
            color: var(--google-text-secondary);
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            accent-color: var(--google-blue);
        }
    </style>
</head>

        <aside>
            <div class="timer-block">
                <div class="timer-display" id="timer">00:00.00</div>
                <button class="btn" id="btn-finish" disabled>Я решил!</button>
                <button class="btn btn-outline" id="btn-reset">Сбросить</button>
            </div>

            <div class="leaderboard">
                <h2>Лучшее время</h2>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Имя</th>
                            <th>Время</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Заполняется через JS -->
                    </tbody>
                </table>
            </div>
        </aside>
    </div>

    <div id="controls">
        <label for="rotation">Поворот фрагмента:</label>
        <input type="range" id="rotation" min="0" max="360" value="0" disabled>
    </div>

    <script>
        // --- ЛОГИКА ТАЙМЕРА И РЕКОРДОВ ---
        let startTime = 0;
        let timerInterval;
        let isTimerRunning = false;
        let leaderboard = JSON.parse(localStorage.getItem('muleLeaderboard')) || [];

        const timerDisplay = document.getElementById('timer');
        const btnFinish = document.getElementById('btn-finish');
        const btnReset = document.getElementById('btn-reset');
        const leaderboardBody = document.getElementById('leaderboard-body');

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            let milliseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            const currentTime = Date.now() - startTime;
            timerDisplay.textContent = formatTime(currentTime);
        }

        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 10);
                btnFinish.disabled = false;
            }
        }

        function stopTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btnFinish.disabled = true;
                
                const finalTimeMs = Date.now() - startTime;
                const finalTimeStr = formatTime(finalTimeMs);
                
                // Небольшая задержка перед алертом, чтобы таймер успел отрисоваться
                setTimeout(() => {
                    const playerName = prompt(`Поздравляем! Ваше время: ${finalTimeStr}\nВведите ваше имя для таблицы рекордов:`, 'Гость');
                    if (playerName && playerName.trim() !== '') {
                        leaderboard.push({ name: playerName.substring(0, 15), time: finalTimeMs, timeStr: finalTimeStr });
                        leaderboard.sort((a, b) => a.time - b.time);
                        localStorage.setItem('muleLeaderboard', JSON.stringify(leaderboard));
                        renderLeaderboard();
                    }
                }, 100);
            }
        }

        function resetTimerAndPuzzle() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerDisplay.textContent = "00:00.00";
            btnFinish.disabled = true;
            
            // Сброс позиций (примерно)
            pieces[0].style.left = '10%'; pieces[0].style.top = '10%';
            pieces[1].style.left = '10%'; pieces[1].style.top = '50%';
            pieces[2].style.left = '50%'; pieces[2].style.top = '30%';
            
            pieces.forEach(p => {
                p.setAttribute('data-angle', 0);
                p.style.transform = `rotate(0deg)`;
                p.classList.remove('active');
            });
            activePiece = null;
            rotationSlider.disabled = true;
            rotationSlider.value = 0;
        }

        function renderLeaderboard() {
            leaderboardBody.innerHTML = '';
            if (leaderboard.length === 0) {
                leaderboardBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#9aa0a6;">Пока нет рекордов</td></tr>';
                return;
            }
            leaderboard.slice(0, 10).forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${entry.name}</td>
                    <td>${entry.timeStr}</td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        btnFinish.addEventListener('click', stopTimer);
        btnReset.addEventListener('click', resetTimerAndPuzzle);

        // Инициализация таблицы при загрузке
        renderLeaderboard();


        // --- ЛОГИКА ДВИЖЕНИЯ И ВРАЩЕНИЯ ---
        const pieces = document.querySelectorAll('.piece');
        const rotationSlider = document.getElementById('rotation');
        const workspace = document.getElementById('workspace');
        
        let activePiece = null;
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;
        let highestZIndex = 10;

        function setActivePiece(piece) {
            if (activePiece) activePiece.classList.remove('active');
            activePiece = piece;
            activePiece.classList.add('active');
            
            highestZIndex++;
            activePiece.style.zIndex = highestZIndex;

            const currentAngle = activePiece.getAttribute('data-angle') || 0;
            rotationSlider.value = currentAngle;
            rotationSlider.disabled = false;
        }

        rotationSlider.addEventListener('input', (e) => {
            if (activePiece) {
                const angle = e.target.value;
                activePiece.setAttribute('data-angle', angle);
                activePiece.style.transform = `rotate(${angle}deg)`;
            }
        });

        pieces.forEach(piece => {
            piece.addEventListener('mousedown', dragStart);
            piece.addEventListener('touchstart', dragStart, { passive: false });
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

                function dragStart(e) {
            // Для мышки отменяем стандартный захват картинки
            if (e.type === 'mousedown' && e.target.tagName.toLowerCase() === 'img') {
                e.preventDefault(); 
            }
            
            startTimer(); 

            const piece = e.currentTarget;
            setActivePiece(piece);
            isDragging = true;

            // Надежное определение координат для мобилок и ПК
            const isTouch = e.type.startsWith('touch');
            startX = isTouch ? e.touches[0].clientX : e.clientX;
            startY = isTouch ? e.touches[0].clientY : e.clientY;

            initialLeft = piece.offsetLeft;
            initialTop = piece.offsetTop;
        }

        function drag(e) {
            if (!isDragging || !activePiece) return;
            e.preventDefault();

            const isTouch = e.type.startsWith('touch');
            const clientX = isTouch ? e.touches[0].clientX : e.clientX;
            const clientY = isTouch ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            activePiece.style.left = `${initialLeft + dx}px`;
            activePiece.style.top = `${initialTop + dy}px`;
        }


        function dragEnd() {
            isDragging = false;
        }

        workspace.addEventListener('mousedown', (e) => {
            if (e.target === workspace) {
                if (activePiece) activePiece.classList.remove('active');
                activePiece = null;
                rotationSlider.disabled = true;
                rotationSlider.value = 0;
            }
        });
    </script>
